version: '3.8'

services:
  satyashield-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satyashield-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./deepfake_detection.db
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./deepfake_detection.db:/app/deepfake_detection.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
